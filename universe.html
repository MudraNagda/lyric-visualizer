<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>the universe · lyric visualizer</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
<style>
  :root {
    --eggshell: #f4efe4;
    --ink: #4a4438;
    --soft: #8a8272;
    --line: rgba(74,68,56,0.18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--eggshell);
    font-family: 'Inter', -apple-system, 'Helvetica Neue', sans-serif;
    color: var(--ink);
  }

  .wrap {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 370px;
    height: 100vh;
  }
  .mapcol {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px 8px 16px 20px;
    overflow: auto;
    min-width: 0;
  }
  .map {
    position: relative;
    aspect-ratio: 1600 / 1100;
    width: min(100%, calc((100vh - 84px) * 1600 / 1100));
    flex: none;
  }
  .map canvas, .map svg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .map { overflow: hidden; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }
  .zoomer {
    position: absolute; inset: 0;
    transform-origin: 0 0;
    transition: transform 1.2s cubic-bezier(0.6, 0, 0.2, 1);
  }
  .map canvas { transition: opacity 0.3s ease; }
  .map #scene { opacity: 0; pointer-events: none; transition: opacity 0.7s ease; }
  .map.in-scene #scene { opacity: 1; pointer-events: auto; transition: opacity 0.9s ease 0.8s; }

  .lenses {
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    margin-bottom: 14px;
    font-size: 0.72rem; letter-spacing: 0.16em; text-transform: lowercase;
  }
  .lenses span { color: var(--soft); margin-right: 6px; }
  .lenses a {
    border: 1px solid rgba(74,68,56,0.28); border-radius: 999px;
    padding: 6px 16px; color: var(--ink); text-decoration: none; opacity: 0.65;
    transition: opacity 0.25s ease, background 0.25s ease, color 0.25s ease;
  }
  .lenses a:hover { opacity: 1; }
  .lenses a.on { background: var(--ink); color: var(--eggshell); opacity: 1; }

  /* ---- overlay ---- */
  .place-label {
    font-family: 'Caveat', cursive;
    font-size: 34px;
    font-weight: 600;
    fill: var(--ink);
    text-anchor: middle;
    cursor: pointer;
    paint-order: stroke;
    stroke: rgba(244,239,228,0.75);
    stroke-width: 5px;
    stroke-linejoin: round;
    transition: opacity 0.4s ease;
  }
  .place-label.night { fill: #f4efe4; stroke: rgba(35,38,79,0.55); }
  .place-label:hover { text-decoration: underline; }
  .place-label.dim { opacity: 0.35; }
  svg.entered .place-label { opacity: 0; pointer-events: none; }

  .thread {
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: 0.3;
    transition: opacity 0.5s ease, stroke-width 0.3s ease;
  }
  .thread.peek { opacity: 0.85; stroke-width: 3.5; }
  .thread.on { opacity: 0.85; stroke-width: 3.5; }
  .thread.off { opacity: 0; }

  .song { cursor: pointer; transition: opacity 0.4s ease, transform 1.1s cubic-bezier(0.6, 0, 0.2, 1); outline: none; }
  .song .dot { transition: r 0.2s ease, opacity 0.4s ease; }
  .song .art {
    opacity: 0; transform: scale(0.3); pointer-events: none;
    transition: opacity 0.5s ease 0.5s, transform 0.6s cubic-bezier(0.3, 1.4, 0.5, 1) 0.5s;
  }
  .song .title {
    font-family: 'Caveat', cursive; font-weight: 600; text-anchor: middle; fill: #2f2a22;
    paint-order: stroke; stroke: rgba(244,239,228,0.85); stroke-linejoin: round;
    opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
  }
  .song.night .title { fill: #f4efe4; stroke: rgba(35,38,79,0.6); }
  svg.entered .song.here .title { opacity: 1; transition-delay: 0.7s; }
  svg.entered .song.here.has-art .dot { opacity: 0; }
  svg.entered .song.here.has-art .art { opacity: 1; transform: scale(1); }
  svg.entered .song.here.has-art:hover .art, svg.entered .song.here.has-art.hot .art,
  svg.entered .song.here.has-art.sel .art { transform: scale(1.18); transition-delay: 0s; }
  svg.entered .song:not(.here) { opacity: 0; pointer-events: none; }
  .song .dot { stroke: var(--eggshell); stroke-width: 2; transition: r 0.2s ease; }
  .song.night .dot { stroke: #23264f; }
  .song .num {
    font-size: 11px; font-weight: 600; text-anchor: middle; dominant-baseline: central;
    fill: #fff; pointer-events: none; display: none;
  }
  .song.night .num { fill: #23264f; }
  .song.dim { opacity: 0.16; }
  .song:hover .dot, .song.hot .dot, .song:focus-visible .dot { r: 10; }
  .song.stop .dot { r: 11; }
  .song.stop .num { display: block; }
  .song.sel .dot { r: 12; stroke: var(--ink); }

  #tip { pointer-events: none; }
  #tip text {
    font-family: 'Caveat', cursive; font-size: 26px; font-weight: 600;
    text-anchor: middle; fill: #2f2a22;
    paint-order: stroke; stroke: #f4efe4; stroke-width: 6px; stroke-linejoin: round;
  }

  /* ---- panel ---- */
  .panel {
    border-left: 1px solid var(--line);
    padding: 34px 30px 60px;
    overflow-y: auto;
    line-height: 1.55;
  }
  .panel h1 { font-family: 'Caveat', cursive; font-size: 2.3rem; font-weight: 600; line-height: 1.1; margin-bottom: 2px; }
  .kicker { font-family: 'Caveat', cursive; font-size: 1.25rem; color: var(--soft); margin-bottom: 12px; }
  .panel p { font-size: 0.88rem; margin-bottom: 14px; }
  .panel p.note { font-size: 0.76rem; color: var(--soft); }
  .panel h2 { font-family: 'Caveat', cursive; font-size: 1.45rem; font-weight: 600; color: var(--soft); margin: 22px 0 4px; }
  .back {
    display: inline-block; font-size: 0.72rem; letter-spacing: 0.14em; color: var(--soft);
    text-decoration: none; margin-bottom: 22px;
  }
  .back:hover { color: var(--ink); }
  .rows { list-style: none; }
  .rows li { border-top: 1px solid var(--line); }
  .rows li:last-child { border-bottom: 1px solid var(--line); }
  .rows a {
    display: grid; grid-template-columns: 22px 1fr; gap: 2px 8px; align-items: baseline;
    padding: 10px 2px; text-decoration: none; color: inherit;
  }
  .rows a:hover .t { text-decoration: underline; }
  .rows .mark { width: 10px; height: 10px; border-radius: 50%; display: inline-block; transform: translateY(1px); }
  .rows .n { font-size: 0.72rem; color: var(--soft); font-variant-numeric: tabular-nums; }
  .rows .t { font-size: 0.9rem; font-style: italic; font-weight: 500; }
  .rows .t small { font-style: normal; font-weight: 400; font-size: 0.7rem; color: var(--soft); letter-spacing: 0.04em; margin-left: 6px; }
  .rows .d { grid-column: 2; font-size: 0.8rem; color: #6a6354; }
  .tag {
    display: inline-block; font-family: 'Caveat', cursive; font-size: 1.15rem; color: var(--soft);
    border-bottom: 1.5px solid var(--line); margin-bottom: 12px; transform: rotate(-1.5deg);
  }
  .paint-link {
    display: inline-block; border: 1px solid rgba(74,68,56,0.28); border-radius: 999px;
    padding: 7px 18px; font-size: 0.72rem; letter-spacing: 0.16em; color: var(--ink);
    text-decoration: none; opacity: 0.75;
  }
  .paint-link:hover { opacity: 1; }

  @media (max-width: 880px) {
    .wrap { display: block; height: auto; }
    .mapcol { display: block; padding: 14px 0 6px 14px; }
    .lenses { position: sticky; left: 0; }
    .map { width: 860px; }
    .panel { border-left: none; border-top: 1px solid var(--line); padding: 26px 20px 60px; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="mapcol">
    <nav class="lenses" id="lenses"></nav>
    <div class="map">
      <div class="zoomer" id="zoomer">
      <canvas id="paint"></canvas>
      <svg id="overlay" viewBox="0 0 1600 1100" aria-label="map of the songs">
        <defs>
          <filter id="wobble" filterUnits="userSpaceOnUse" x="0" y="0" width="1600" height="1100">
            <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" seed="4" result="n"/>
            <feDisplacementMap in="SourceGraphic" in2="n" scale="9"/>
          </filter>
        </defs>
        <g id="labels"></g>
        <g id="threads" filter="url(#wobble)"></g>
        <g id="songs"></g>
        <g id="tip"><text></text></g>
      </svg>
      </div>
      <canvas id="scene"></canvas>
    </div>
  </div>
  <aside class="panel" id="panel"></aside>
</div>

<script src="worlds/kit.js"></script>
<script src="worlds/city.js"></script>
<script>
/* ================================================================
   The world: places, songs, and the threads that tie them together.
   Every description is a paraphrase of a song's imagery — no lyrics.
   ================================================================ */
const W = 1600, H = 1100;

const PLACES = [
  { id: 'sky', name: 'the 2 a.m. sky', cx: 800, cy: 92, rx: 640, ry: 40, wash: '#2c2f5c', dot: '#f6e7b0',
    blurb: 'Nobody sleeps in these songs. It is always 2 a.m. and someone is pacing the floor, going over what they said. I put them up here because the night sits over everything else on the map.' },
  { id: 'castle', name: 'the storybook kingdom', cx: 270, cy: 390, rx: 175, ry: 125, wash: '#b9a3d6', dot: '#7a5fa8',
    blurb: 'She gave us the balcony and the white horse first. Then she kept coming back to knock the castle down and see what was still standing. I love that she never fully gives up on it.' },
  { id: 'woods', name: 'the folklore woods', cx: 770, cy: 385, rx: 215, ry: 130, wash: '#6f8f6a', dot: '#3f6141',
    blurb: 'This is where she stops singing as herself. The woods are full of made-up people and borrowed memories, told quietly, like stories you would find in a cabin drawer.' },
  { id: 'london', name: 'across the sea', cx: 1405, cy: 315, rx: 130, ry: 82, wash: '#8d97a6', dot: '#566070',
    blurb: 'A grey, rainy island. First she misses someone who flew there. Then she moves there. Then she has to say goodbye to it.' },
  { id: 'town', name: 'the small town', cx: 255, cy: 770, rx: 190, ry: 145, wash: '#e2b75c', dot: '#9a7420',
    blurb: 'Porch lights, pickup trucks, bleachers, a school hallway. It all starts here. And she keeps sending people back, for the holidays or to say sorry.' },
  { id: 'road', name: 'the autumn road', cx: 620, cy: 655, rx: 150, ry: 118, wash: '#c9643a', dot: '#a3432a',
    blurb: 'The road out of town, and it is always fall. So many of these love stories happen in a car. So do most of the crashes.' },
  { id: 'city', name: 'the city', cx: 1015, cy: 650, rx: 175, ry: 128, wash: '#5f6f9c', dot: '#3d4a78',
    blurb: 'Where the road ends. Rented apartments, dive bars, other people’s lit windows. In the city love gets an address, which is what makes losing it so hard.' },
  { id: 'coast', name: 'the coast', cx: 1395, cy: 680, rx: 140, ry: 165, wash: '#7fbfb5', dot: '#2f7d78',
    blurb: 'Salt air, and one particular house above the water. This is where summer lives, along with the storms that finally wash someone away.' },
  { id: 'stage', name: 'the stage', cx: 800, cy: 945, rx: 205, ry: 100, wash: '#e58a5a', dot: '#c2552f',
    blurb: 'Spotlights and sequins. She has been asking what fame does to a girl since she was twenty-two, and she is still asking.' }
];

const SONGS = [
  // the 2 a.m. sky
  ['The Way I Loved You', 'Fearless', 'sky', 'A screaming match in the rain at two in the morning, missed more than the polite, sensible love that replaced it.'],
  ['Enchanted', 'Speak Now', 'sky', 'Pacing the floor wide awake after meeting a stranger, replaying the conversation and hoping nobody is waiting for him at home.'],
  ['Last Kiss', 'Speak Now', 'sky', 'A goodbye remembered down to the minute on the clock, just before two.'],
  ['Never Grow Up', 'Speak Now', 'sky', 'A nightlight in a child’s room, and then, years later, the first cold night alone in a new apartment.', 1],
  ['I Wish You Would', '1989', 'sky', 'Headlights sliding past a window at 2 a.m., two people thinking the same thing on either side of the glass.'],
  ['The Archer', 'Lover', 'sky', 'Lying awake taking inventory of every exit she has ever taken, asking who could possibly stay.'],
  ['Anti-Hero', 'Midnights', 'sky', 'Lying awake listing everything that is wrong with her, and somehow making it funny.'],
  ['Midnight Rain', 'Midnights', 'sky', 'He is a clear, steady day. She is a downpour after dark that could not stay put.'],
  ['You’re On Your Own, Kid', 'Midnights', 'sky', 'A whole life replayed in one sitting, from waiting around in a hometown to realising that being alone was never the danger.'],

  // the storybook kingdom
  ['Love Story', 'Fearless', 'castle', 'A balcony, a disapproving father, and the famous tragedy rewritten so it ends with a ring instead of a tomb.'],
  ['White Horse', 'Fearless', 'castle', 'The fairy tale gets called off. Nobody is riding in to rescue her, and this was only ever a small town.'],
  ['Long Live', 'Speak Now', 'castle', 'Crowns worn for one night, dragons fought alongside a band of friends, and a plea to be remembered for it.'],
  ['Castles Crumbling', 'Speak Now (vault)', 'castle', 'A once-adored ruler watching the walls come down and the crowd turn.'],
  ['New Romantics', '1989', 'castle', 'Every brick thrown at her gets saved and used as building material.'],
  ['Call It What You Want', 'reputation', 'castle', 'The castle is gone overnight, and she notices she is doing better without it.'],
  ['King of My Heart', 'reputation', 'castle', 'Royalty redefined as a single person. No palace, no fancy cars, no court required.'],
  ['The Fate of Ophelia', 'The Life of a Showgirl', 'castle', 'A heroine written to drown is pulled out of her tower and her ending before the last act.'],

  // the folklore woods
  ['cardigan', 'folklore', 'woods', 'Feeling like an old sweater forgotten under a bed, until someone picks it up and puts it on.'],
  ['seven', 'folklore', 'woods', 'A swing high over a creek at age seven, and a plan to rescue a friend from a house that was not safe.'],
  ['the 1', 'folklore', 'woods', 'A shrug and a what-if. It would have been nice if that one person had been the one.'],
  ['invisible string', 'folklore', 'woods', 'A single gold thread that was quietly tying two strangers together through every wrong turn.'],
  ['willow', 'evermore', 'woods', 'Following a glowing thread through the trees, bending like a branch in the wind.'],
  ['ivy', 'evermore', 'woods', 'A stone house slowly covered in vines, and a married woman overgrown by a love she did not plan.'],
  ['marjorie', 'evermore', 'woods', 'A grandmother’s advice still arriving, as if she had only stepped into the next room.'],
  ['evermore', 'evermore', 'woods', 'A long grey winter on a cabin porch, until the pain stops feeling permanent.'],

  // across the sea
  ['Come Back… Be Here', 'Red', 'london', 'He boards a plane for London and she is left in New York wishing she had said more.'],
  ['London Boy', 'Lover', 'london', 'A giddy tourist’s lap of his city. Markets, pubs, the back of a scooter.'],
  ['the lakes', 'folklore', 'london', 'Wanting to vanish into the northern hills where the old poets went, with one person and no audience.'],
  ['So Long, London', 'The Tortured Poets Department', 'london', 'A farewell to the city and to everything she wore herself out keeping alive there.'],
  ['The Black Dog', 'The Tortured Poets Department', 'london', 'Watching from far away as a dot on a map walks into a pub without her.'],

  // the small town
  ['Tim McGraw', 'Taylor Swift', 'town', 'A pickup that gets stuck on back roads, a summer ending, a letter left on a doorstep.'],
  ['Our Song', 'Taylor Swift', 'town', 'A slamming screen door, a hushed late phone call, a tap on the window. Ordinary sounds that become their song.'],
  ['Teardrops on My Guitar', 'Taylor Swift', 'town', 'A classroom crush who talks about someone else, and a guitar waiting at home to hear about it.'],
  ['Mary’s Song', 'Taylor Swift', 'town', 'Two kids in a backyard who grow old on the same front porch.'],
  ['Fifteen', 'Fearless', 'town', 'The first morning through the high-school doors, when a hallway feels like the entire world.'],
  ['You Belong With Me', 'Fearless', 'town', 'Two bedroom windows facing each other, and the girl in the bleachers who understands him best.'],
  ['betty', 'folklore', 'town', 'A seventeen-year-old on a skateboard rehearsing an apology on the way to a party at her house.'],
  ['’tis the damn season', 'evermore', 'town', 'Home at her parents’ house for the holidays, where the road not taken looks good for a weekend.'],
  ['dorothea', 'evermore', 'town', 'The one who stayed, watching an old friend on a screen and keeping a place for her.'],

  // the autumn road
  ['Fearless', 'Fearless', 'road', 'A slow drive down a rain-slick street, wanting to get out and dance in the storm in her best dress.'],
  ['Red', 'Red', 'road', 'Every part of a love gets a colour. Losing is blue, missing is grey, and the love itself was the loud one.'],
  ['Treacherous', 'Red', 'road', 'Headlights on a drive home she knows is a risk, taken anyway.'],
  ['All Too Well', 'Red', 'road', 'A drive upstate under falling leaves, a scarf left in a drawer, a dance in a kitchen lit only by the open fridge.', 3],
  ['Begin Again', 'Red', 'road', 'A café on a Wednesday, and a first date that lets eight months of hurt go.'],
  ['Style', '1989', 'road', 'Headlights off on a long midnight drive, a pair who never quite go out of fashion with each other.'],
  ['Out of the Woods', '1989', 'road', 'A sudden brake, stitches, a hospital room, and the same anxious question asked again and again.'],
  ['Getaway Car', 'reputation', 'road', 'A heist movie where the escape vehicle is a rebound, and she is the one who drives off alone.'],

  // the city
  ['Holy Ground', 'Red', 'city', 'A short love remembered at a sprint. The blocks they walked still feel like somewhere sacred.'],
  ['Welcome to New York', '1989', 'city', 'Boxes dropped on an apartment floor and a decision to be somebody new.'],
  ['How You Get the Girl', '1989', 'city', 'Standing at her door in the pouring rain after six months away, with instructions for what to say.', 2],
  ['Delicate', 'reputation', 'city', 'A dive bar on the east side, a name at its lowest, and the careful question of whether it is too soon.'],
  ['Cornelia Street', 'Lover', 'city', 'A rented place in the Village and a street she could never walk down again if this ended.'],
  ['Cruel Summer', 'Lover', 'city', 'Slipping through a garden gate, crying in the back of a car, finally shouting the true thing.'],
  ['Lover', 'Lover', 'city', 'Christmas lights left up into January, in a home where the two of them make the rules.'],
  ['Daylight', 'Lover', 'city', 'She takes back what she once said about love being red. It turned out to be the gold of morning.'],
  ['Maroon', 'Midnights', 'city', 'Cheap wine on a shirt, a flushed cheek. The red of an old love, gone a shade darker with time.'],
  ['I Look in People’s Windows', 'The Tortured Poets Department', 'city', 'Walking past lit windows at night, hoping to catch one face at someone else’s dinner table.', 0],

  // the coast
  ['Starlight', 'Red', 'coast', 'The summer of 1945: two teenagers sneaking into a yacht-club party and dancing like they own it.'],
  ['This Love', '1989', 'coast', 'A love that goes out with the tide and, against the odds, comes back in.'],
  ['Clean', '1989', 'coast', 'A long drought broken by a storm. She comes up for air and he is finally washed off.'],
  ['the last great american dynasty', 'folklore', 'coast', 'A house on the Rhode Island shore, the scandalous widow who owned it, and the woman who bought it afterwards.'],
  ['august', 'folklore', 'coast', 'Salt air and a summer that slipped away, from the girl who knew he was never hers to lose.'],
  ['coney island', 'evermore', 'coast', 'A cold bench on an off-season boardwalk, wondering where the two of them went.'],
  ['Florida!!!', 'The Tortured Poets Department', 'coast', 'A sunburnt state where people go to be someone else for a while.'],

  // the stage
  ['The Lucky One', 'Red', 'stage', 'A starlet who got everything, then vanished to tend a garden. The singer starts to envy her.'],
  ['Nothing New', 'Red (vault)', 'stage', 'Twenty-two and already afraid of the day a fresher face takes her place.'],
  ['Blank Space', '1989', 'stage', 'The tabloid caricature played completely straight, mansion and all.'],
  ['Look What You Made Me Do', 'reputation', 'stage', 'All her old selves lined up and declared dead. A villain built out of other people’s headlines.'],
  ['mirrorball', 'folklore', 'stage', 'Spinning on tiptoe, showing everyone in the room themselves, still performing after the crowd goes home.'],
  ['Clara Bow', 'The Tortured Poets Department', 'stage', 'Each new star told she resembles the last one, in a line that finally arrives at her own name.'],
  ['I Can Do It With a Broken Heart', 'The Tortured Poets Department', 'stage', 'Hitting every mark in sequins, grinning, while coming apart underneath.'],
  ['The Life of a Showgirl', 'The Life of a Showgirl', 'stage', 'A veteran performer warns a young fan off the life. The fan signs up anyway.']
].map(([title, album, place, image, painted]) => ({
  id: title.toLowerCase().replace(/[’'!….,]/g, '').trim().replace(/\s+/g, '-'),
  title, album, place, image, painted
}));

const THREADS = [
  { id: 'triangle', name: 'the love triangle', color: '#8d6fc2', canon: true,
    blurb: 'One teenage summer, told three times. She has said these three are the same story. The girl who got left, the girl he left her for, and the boy who did it.',
    stops: [
      ['cardigan', 'Betty, years later, remembering being seventeen and knowing he would come back.'],
      ['august', 'The other girl’s version. She always knew the summer was borrowed.'],
      ['betty', 'James finally tells it himself, practising an apology on the way to her porch.']
    ] },
  { id: 'home', name: 'leaving home, coming back', color: '#8a6a3b', canon: true,
    blurb: 'Someone leaves the small town on the very first album. Fourteen years later she writes the homecoming twice, once from the one who left and once from the one who stayed.',
    stops: [
      ['tim-mcgraw', 'Summer ends, someone leaves, and a letter stays behind on a doorstep.'],
      ['fifteen', 'The town at its largest, when a school hallway is the whole world.'],
      ['welcome-to-new-york', 'The leap. Arriving somewhere big and deciding to be new.'],
      ['youre-on-your-own-kid', 'The entire journey in one song, from waiting around at home to the life she built alone.'],
      ['tis-the-damn-season', 'The one who left comes back for the holidays and falls into an old habit.'],
      ['dorothea', 'The same visit from the one who stayed, still keeping a place for her.']
    ] },
  { id: 'car', name: 'the getaway car', color: '#b5452f',
    blurb: 'Count how many of these love stories happen in a car. It starts out as freedom, then it is where the memories get made, then it crashes. In the end she calls it what it was.',
    stops: [
      ['tim-mcgraw', 'It begins in a truck that tends to get stuck on back roads.'],
      ['fearless', 'A slow drive through town on wet pavement, first-date nerves in the passenger seat.'],
      ['treacherous', 'She knows the drive home is a risk and takes it.'],
      ['all-too-well', 'He nearly runs a red light looking at her. That drive upstate becomes the memory she cannot put down.'],
      ['style', 'Headlights off at midnight, a couple that keeps circling back.'],
      ['out-of-the-woods', 'The car finally crashes. Brakes too soon, stitches, a hospital room.'],
      ['getaway-car', 'She names the pattern. Nothing good begins with fleeing the scene.'],
      ['cruel-summer', 'Still in the back seat, crying on the way home, saying the true thing out loud.']
    ] },
  { id: 'rain', name: 'rain', color: '#4f86a8',
    blurb: 'Rain is never just weather here. First it is something to dance in. Then every big scene happens in it. By the end she is the rain.',
    stops: [

const INK = '#3a3228';

function mulberry32(a) {
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function paintMap(lens) {
  const cv = document.createElement('canvas');
  const K = 2;
  cv.width = W * K; cv.height = H * K;
  const g = cv.getContext('2d');
  g.scale(K, K);
  const rand = mulberry32(1989);
  const rr = (a, b) => a + rand() * (b - a);

  /* wobbly translucent blob — the watercolor brush */
  function blob(cx, cy, r, color, alpha, layers = 3, squishY = 1) {
    for (let L = 0; L < layers; L++) {
      const rad = r * (1 - L * 0.16);
      const n = 14, pts = [];
      const phase = rand() * Math.PI * 2;
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2;
        const wob = 1 + 0.22 * Math.sin(a * 3 + phase) * rand() + 0.12 * Math.sin(a * 7 + phase * 2);
        pts.push([cx + Math.cos(a) * rad * wob, cy + Math.sin(a) * rad * wob * squishY]);
      }
      g.save();
      g.globalAlpha = alpha * (0.5 + L * 0.18);
      g.fillStyle = color;
      g.filter = `blur(${Math.max(1, rad * 0.10) * K}px)`;
      g.beginPath();
      g.moveTo(pts[0][0], pts[0][1]);
      for (let i = 0; i < n; i++) {
        const p = pts[i], q = pts[(i + 1) % n];
        g.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
      }
      g.closePath();
      g.fill();
      g.restore();
    }
  }
  function ink(alpha = 0.75, width = 1.5) {
    g.strokeStyle = INK; g.globalAlpha = alpha; g.lineWidth = width;
    g.lineCap = 'round'; g.lineJoin = 'round';
  }
  function shape(fill, alpha, pts, stroke = true) {
    g.save();
    g.beginPath();
    pts.forEach((p, i) => i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1]));
    g.closePath();
    g.globalAlpha = alpha; g.fillStyle = fill; g.fill();

/* ================================================================
   Overlay: region names, threads, songs
   ================================================================ */
const NS = 'http://www.w3.org/2000/svg';
const el = (name, attrs = {}, parent) => {
  const e = document.createElementNS(NS, name);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
};
const svg = document.getElementById('overlay');
const zoomer = document.getElementById('zoomer');
const canvas = document.getElementById('paint');
const gLabels = document.getElementById('labels');
const gThreads = document.getElementById('threads');
const gSongs = document.getElementById('songs');
const tipText = document.querySelector('#tip text');
const lensNav = document.getElementById('lenses');

let lens = null;          // the lens currently drawn
let zoom = 1;
const painted = {};

function smoothPath(pts) {
  if (pts.length < 2) return '';
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    const t = 0.22;
    d += ` C${p1[0] + (p2[0] - p0[0]) * t},${p1[1] + (p2[1] - p0[1]) * t} ${p2[0] - (p3[0] - p1[0]) * t},${p2[1] - (p3[1] - p1[1]) * t} ${p2[0]},${p2[1]}`;
  }
  return d;
}

/* long titles break onto two lines so neighbours don't collide */
function titleLines(t) {
  if (t.length < 17) return [t];
  let best = -1;
  for (let i = 0; i < t.length; i++) {
    if (t[i] === ' ' && (best < 0 || Math.abs(i - t.length / 2) < Math.abs(best - t.length / 2))) best = i;
  }
  return best < 0 ? [t] : [t.slice(0, best), t.slice(best + 1)];
}

function buildOverlay() {
  lensNav.innerHTML = '<span>view by</span>' + LENSES.map(l => `<a href="#${l.id}" data-lens="${l.id}">${l.label}</a>`).join('');
  for (const th of THREADS) th.path = el('path', { class: 'thread', stroke: th.color }, gThreads);
  for (const s of SONGS) {
    const grp = el('g', { class: 'song', tabindex: 0, role: 'button', 'aria-label': s.title }, gSongs);
    el('circle', { r: 20, fill: 'transparent' }, grp);
    s.dot = el('circle', { class: 'dot', r: 7 }, grp);
    s.num = el('text', { class: 'num', y: 0.5 }, grp);
    if (ARTIFACTS[s.id]) {
      grp.classList.add('has-art');
      const art = el('g', { class: 'art', stroke: '#3a3228', 'stroke-width': 1.1, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }, grp);
      art.innerHTML = '<ellipse cx="0" cy="18" rx="13" ry="2.4" fill="#3a3228" opacity="0.13" stroke="none"/>' + ARTIFACTS[s.id];
    }
    s.label = el('text', { class: 'title' }, grp);
    s.lines = titleLines(s.title).map(line => { const t = el('tspan', { x: 0 }, s.label); t.textContent = line; return t; });
    grp.addEventListener('mouseenter', () => showTip(s));
    grp.addEventListener('mouseleave', () => showTip(current.song));
    grp.addEventListener('focus', () => showTip(s));
    grp.addEventListener('click', () => go('song', s.id));
    grp.addEventListener('keydown', e => { if (e.key === 'Enter') go('song', s.id); });
    s.node = grp;
  }
}

/* redraw everything that depends on the lens: paint, names, positions */
function setLens(next) {
  const first = !lens;
  lens = next;
  lensNav.querySelectorAll('a').forEach(a => a.classList.toggle('on', a.dataset.lens === lens.id));

  const draw = () => {
    painted[lens.id] = painted[lens.id] || paintMap(lens);
    const src = painted[lens.id];
    canvas.width = src.width; canvas.height = src.height;
    canvas.getContext('2d').drawImage(src, 0, 0);
    canvas.style.opacity = 1;
  };
  if (first) draw(); else { canvas.style.opacity = 0; setTimeout(draw, 300); }

  gLabels.innerHTML = '';
  for (const p of lens.regions) {
    const t = el('text', {
      class: 'place-label' + (p.id === 'sky' ? ' night' : ''),
      x: p.cx, y: p.id === 'sky' ? 30 : p.cy - p.ry - 16
    }, gLabels);
    t.textContent = p.name;
    t.addEventListener('click', () => go('in', p.id));
    p.label = t;
  }
  for (const s of SONGS) {
    const p = lens.regionById[s.where[lens.id]];
    s.x = s.pos[lens.id].x; s.y = s.pos[lens.id].y;
    s.node.style.transform = `translate(${s.x}px, ${s.y}px)`;
    s.node.classList.toggle('night', p.id === 'sky');
    s.dot.setAttribute('fill', p.dot);
  }
  for (const th of THREADS) {
    th.path.setAttribute('d', smoothPath(th.stops.map(([id]) => [songById[id].x, songById[id].y])));
    th.path.classList.remove('on');
    th.len = th.path.getTotalLength();
  }
}

/* step into a region: the map scales up around it, dots become objects */
function setZoom(region) {
  zoom = region ? Math.max(1, Math.min(3.4, W / (2.5 * region.rx), H / (2.9 * region.ry))) : 1;
  const clamp = v => Math.min(0, Math.max(1 - zoom, v));
  const tx = region ? clamp(0.5 - region.cx / W * zoom) : 0;
  const ty = region ? clamp(0.5 - region.cy / H * zoom) : 0;
  zoomer.style.transform = `translate(${tx * 100}%, ${ty * 100}%) scale(${zoom})`;
  svg.classList.toggle('entered', !!region);
  tipText.setAttribute('font-size', 26 / zoom);
  tipText.style.strokeWidth = 6 / zoom + 'px';
  if (!region) return;
  const fs = Math.max(11, Math.min(20, 34 / zoom));
  region.songs.forEach((s, i) => {
    const art = !!ARTIFACTS[s.id];
    const above = region.id === 'sky' && i % 2;
    s.label.setAttribute('font-size', fs);
    s.label.style.strokeWidth = fs * 0.4 + 'px';
    const y0 = above ? -(12 + (s.lines.length - 1) * fs * 1.15) : (art ? 22 : 9) + fs;
    s.lines.forEach((t, n) => t.setAttribute('y', y0 + n * fs * 1.15));
  });
}

function showTip(s) {
  if (!s || (svg.classList.contains('entered') && s.node.classList.contains('here'))) { tipText.textContent = ''; return; }
  tipText.textContent = s.title;
  const half = tipText.getComputedTextLength() / 2 + 10;
  tipText.setAttribute('x', Math.min(W - half, Math.max(half, s.x)));
  tipText.setAttribute('y', s.y < 60 ? s.y + 40 : s.y - 18);
}

/* ================================================================
   Panel + state (kept in the URL hash so back/forward work):
   #lens, #lens/in=region, #lens/thread=id, #lens/song=id
   ================================================================ */
const panel = document.getElementById('panel');
const current = { song: null };
let threadContext = null;   // the thread a song was opened from, so its path stays lit
let regionContext = null;   // the region a song was opened inside, so we stay zoomed in
const stage = new WorldStage(document.getElementById('scene'), {
  pick: id => go('song', id),
  title: id => songById[id].title
});

const link = (kind, id) => `#${lens.id}` + (kind ? `/${kind}=${id}` : '');
function go(kind, id) { location.hash = link(kind, id); }

const mark = p => `<span><i class="mark" style="background:${p.id === 'sky' ? '#2c2f5c' : p.dot || p.color}"></i></span>`;
const songRow = (s, n, text) => `
  <li><a href="${link('song', s.id)}" data-song="${s.id}">
    <span class="n">${n}</span>
    <span class="t">${s.title}<small>${s.album}</small></span>
    <span class="d">${text}</span>
  </a></li>`;

function render() {
  const m = location.hash.match(/^#(place|emotion|persona|mind)?\/?(?:(\w+)=([\w-]+))?$/) || [];
  const want = lensById[m[1]] || lensById.place;
  if (want !== lens) { setLens(want); threadContext = regionContext = null; }
  let kind = m[2] || 'home';
  const id = m[3];
  const region = kind === 'in' && lens.regionById[id];
  const thread = kind === 'thread' && threadById[id];
  const song = kind === 'song' && songById[id];
  if (!region && !thread && !song) kind = 'home';

  if (thread) { threadContext = thread; regionContext = null; }
  if (region) { regionContext = region; threadContext = null; }
  if (kind === 'home') threadContext = regionContext = null;
  if (song && threadContext && !song.threads.includes(threadContext)) threadContext = null;
  if (song && regionContext && song.where[lens.id] !== regionContext.id) regionContext = null;
  const lit = thread || (song && threadContext) || null;
  const inside = region || (song && !lit && regionContext) || null;
  current.song = song || null;

  // map
  setZoom(inside);
  const world = (lens.id === 'place' && inside && WORLDS[inside.id]) || null;
  stage.show(world);
  stage.select(world && song ? song.id : null);
  stage.hot(null);
  document.querySelector('.map').classList.toggle('in-scene', !!world);
  const members = lit ? new Set(lit.stops.map(s => s[0])) : null;
  for (const s of SONGS) {
    s.node.classList.toggle('here', !!inside && inside.songs.includes(s));
    s.node.classList.toggle('dim', members ? !members.has(s.id) : !!song && !inside && s !== song);
    s.node.classList.toggle('sel', s === song);
    const n = lit ? lit.stops.findIndex(st => st[0] === s.id) : -1;
    s.node.classList.toggle('stop', n >= 0);
    s.num.textContent = n >= 0 ? n + 1 : '';
  }
  for (const th of THREADS) {
    const on = th === lit;
    const wasOn = th.path.classList.contains('on');
    th.path.classList.toggle('on', on);
    th.path.classList.toggle('off', !on && kind !== 'home');
    if (on && !wasOn) {
      th.path.style.transition = 'none';
      th.path.style.strokeDasharray = th.len;
      th.path.style.strokeDashoffset = th.len;
      th.path.getBoundingClientRect();
      th.path.style.transition = `stroke-dashoffset ${Math.min(3.2, 0.9 + th.len / 700)}s ease-in-out, opacity 0.5s ease`;
      th.path.style.strokeDashoffset = 0;
    } else if (!on) {
      th.path.style.transition = '';
      th.path.style.strokeDasharray = '';
      th.path.style.strokeDashoffset = '';
    }
  }
  for (const p of lens.regions) p.label.classList.toggle('dim', !!song && !lit && song.where[lens.id] !== p.id);
  showTip(song);

  // panel
  let html = '';
  if (kind === 'home') {
    html = `
      <h1>${lens.title}</h1>
      <div class="kicker">${lens.kicker}</div>
      ${lens.intro.map(t => `<p>${t}</p>`).join('')}
      <h2>${lens.noun}</h2>
      <ul class="rows">${lens.regions.map(p => `
        <li><a href="${link('in', p.id)}">
          ${mark(p)}
          <span class="t">${p.name}<small>${p.songs.length} songs</small></span>
        </a></li>`).join('')}</ul>
      <h2>threads</h2>
      <ul class="rows">${THREADS.map(t => `
        <li><a href="${link('thread', t.id)}" data-thread="${t.id}">
          ${mark(t)}
          <span class="t">${t.name}<small>${t.stops.length} songs</small></span>
        </a></li>`).join('')}</ul>
      <p class="note" style="margin-top:22px">None of the song notes are lyrics. They are my own descriptions of what each song pictures. She has confirmed a few of the threads herself. The rest, and all of the sorting, is just how I hear it.</p>
      <a class="paint-link" href="index.html">the paintings →</a>`;
  } else if (region) {
    html = `
      <a class="back" href="${link()}">← step back out</a>
      <h1>${region.name}</h1>
      <div class="kicker">${region.sub ? region.sub + ' · ' : ''}${region.songs.length} songs live here</div>
      <p>${region.blurb}</p>
      ${world ? '<p class="note">You are standing on the street now. Every song is something on this block. Move around and see what answers.</p>' : ''}
      <ul class="rows">${region.songs.map(s => songRow(s, '·', s.image)).join('')}</ul>`;
  } else if (thread) {
    html = `
      <a class="back" href="${link()}">← the whole map</a>
      <h1>${thread.name}</h1>
      <div class="kicker">a thread through ${new Set(thread.stops.map(s => songById[s[0]].where[lens.id])).size} ${lens.noun}</div>
      <span class="tag">${thread.canon ? 'she has said this herself' : 'my own theory'}</span>
      <p>${thread.blurb}</p>
      <ul class="rows">${thread.stops.map(([sid, note], i) => songRow(songById[sid], i + 1, note)).join('')}</ul>`;
  } else {
    const home = lens.regionById[song.where[lens.id]];
    html = `
      <a class="back" href="${lit ? link('thread', lit.id) : link('in', home.id)}">← ${lit ? lit.name : home.name}</a>
      <h1>${song.title}</h1>
      <div class="kicker">${song.album}</div>
      <p>${song.image}</p>
      <h2>where it lives</h2>
      <ul class="rows">${LENSES.map(l => { const p = l.regionById[song.where[l.id]]; return `
        <li><a href="#${l.id}/in=${p.id}">
          ${mark(p)}
          <span class="t">${p.name}<small>${l.label}</small></span>
        </a></li>`; }).join('')}</ul>
      ${song.threads.length ? `<h2>threads running through it</h2>
      <ul class="rows">${song.threads.map(t => `
        <li><a href="${link('thread', t.id)}" data-thread="${t.id}">
          ${mark(t)}
          <span class="t">${t.name}</span>
          <span class="d">${t.stops.find(st => st[0] === song.id)[1]}</span>
        </a></li>`).join('')}</ul>` : ''}
      ${song.painted !== undefined ? `<p style="margin-top:24px"><a class="paint-link" href="index.html#song=${song.painted}">watch it painted →</a></p>` : ''}`;
  }
  panel.innerHTML = html;
  panel.scrollTop = 0;

  // hovering a row points at the map
  panel.querySelectorAll('[data-song]').forEach(a => {
    const s = songById[a.dataset.song];
    a.addEventListener('mouseenter', () => { s.node.classList.add('hot'); showTip(s); stage.hot(s.id); });
    a.addEventListener('mouseleave', () => { s.node.classList.remove('hot'); showTip(current.song); stage.hot(null); });
  });
  panel.querySelectorAll('[data-thread]').forEach(a => {
    const t = threadById[a.dataset.thread];
    a.addEventListener('mouseenter', () => t.path.classList.add('peek'));
    a.addEventListener('mouseleave', () => t.path.classList.remove('peek'));
  });
}

/* the painting has no frame: its edge is a torn, bleeding wash, so the
   world sits on the paper instead of inside a box */
(function softEdge() {
  const rand = mulberry32(22), pts = [];
  const side = (x1, y1, x2, y2, nx, ny) => {
    const n = Math.round(Math.hypot(x2 - x1, y2 - y1) / 95);
    for (let i = 0; i < n; i++) {
      const inset = 34 + rand() * 46 + (rand() < 0.2 ? 30 : 0);
      pts.push([x1 + (x2 - x1) * i / n + nx * inset, y1 + (y2 - y1) * i / n + ny * inset]);
    }
  };
  side(0, 0, W, 0, 0, 1); side(W, 0, W, H, -1, 0); side(W, H, 0, H, 0, -1); side(0, H, 0, 0, 1, 0);
  const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2];
  let d = 'M' + mid(pts[pts.length - 1], pts[0]).map(v => v.toFixed(0));
  pts.forEach((p, i) => { d += ` Q${p.map(v => v.toFixed(0))} ${mid(p, pts[(i + 1) % pts.length]).map(v => v.toFixed(0))}`; });
  const svgMask = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <filter id="f" x="0" y="0" width="${W}" height="${H}" filterUnits="userSpaceOnUse">
      <feTurbulence type="fractalNoise" baseFrequency="0.006" numOctaves="2" seed="7"/>
      <feDisplacementMap in="SourceGraphic" scale="95"/>
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <path d="${d}Z" fill="#fff" filter="url(#f)"/></svg>`;
  const url = `url("data:image/svg+xml,${encodeURIComponent(svgMask)}")`;
  const map = document.querySelector('.map');
  map.style.webkitMaskImage = url;
  map.style.maskImage = url;
})();

buildOverlay();
render();
window.addEventListener('hashchange', render);
</script>
</body>
</html>
